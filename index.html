<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrahedral Number 3D Visualizer</title>
    <style>
        :root {
            --bg-color: #111;
            --ui-bg: rgba(20, 20, 25, 0.85);
            --ui-border: rgba(255, 255, 255, 0.1);
            --text-main: #eee;
            --text-muted: #888;
            --accent: #00d2ff;
            --ui-shadow: rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --ui-bg: rgba(255, 255, 255, 0.85);
            --ui-border: rgba(0, 0, 0, 0.1);
            --text-main: #222;
            --text-muted: #666;
            --accent: #0088ff;
            --ui-shadow: rgba(0, 0, 0, 0.1);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background: var(--bg-color); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            transition: background 0.3s;
        }

        .panel {
            position: absolute; 
            background: var(--ui-bg); 
            border: 1px solid var(--ui-border);
            border-radius: 12px; 
            padding: 24px; 
            color: var(--text-main); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px var(--ui-shadow);
            user-select: none;
            transition: all 0.3s;
        }

        #ui-left { top: 20px; left: 20px; width: 280px; }
        #ui-right { top: 20px; right: 20px; width: 300px; display: flex; flex-direction: column; align-items: center; }
        #ui-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 16px; border-radius: 30px; }

        h1, h2 { 
            font-size: 1.25rem; 
            margin: 0 0 20px 0; 
            font-weight: 600;
        }
        h2 { font-size: 1.1rem; text-align: center; margin-bottom: 12px; }

        .stat { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 12px; 
            font-size: 1.05rem; 
            padding-bottom: 8px;
            border-bottom: 1px solid var(--ui-border);
        }
        .stat:last-of-type { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        
        .val { font-weight: bold; color: var(--accent); font-size: 1.2rem; }
        
        .slider-wrap { margin-top: 24px; }
        input[type=range] { 
            width: 100%; 
            cursor: pointer; 
            background: var(--ui-border);
            height: 6px;
            border-radius: 3px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.4);
        }

        .labels { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-top: 8px; 
            font-weight: 500;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--ui-border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn:hover { background: var(--ui-border); color: var(--accent); }
        .btn:active { transform: scale(0.95); }

        /* SVG container for 2D representation */
        #svg-container {
            width: 250px;
            height: 250px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #export-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); color: white;
            display: none; justify-content: center; align-items: center;
            font-size: 1.5rem; z-index: 100; flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white; border-radius: 50%;
            animation: spin 1s linear infinite; margin-top: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="export-overlay">
        <span>Generating WebM...</span>
        <div class="spinner"></div>
    </div>

    <div class="panel" id="ui-left">
        <div style="display:flex; justify-content: space-between; align-items: baseline;">
            <h1>3D Visualizer</h1>
            <button class="btn" id="btn-theme" style="padding: 4px 10px; font-size: 0.8rem;">To Light</button>
        </div>
        
        <div class="stat">
            <span>Base Size (n)</span>
            <span class="val" id="val-n">1</span>
        </div>
        <div class="stat">
            <span style="display:flex; flex-direction:column;">
                <span>Total Spheres</span>
                <span style="font-size:0.8rem; color:var(--text-muted);">(Tetrahedral)</span>
            </span>
            <span class="val" id="val-tn">1</span>
        </div>
        
        <div class="slider-wrap">
            <label for="slider-n" style="font-size: 0.9em; color:var(--text-muted);">Tetrahedral Base Size (n)</label>
            <input type="range" id="slider-n" min="1" max="10" value="8" step="1">
            <div class="labels">
                <span>1</span>
                <span>10</span>
            </div>
        </div>

        <div class="stat" style="margin-top: 30px;">
            <span>Selected Layer (k)</span>
            <span class="val" id="val-k">0</span>
        </div>
        <div class="stat" style="margin-bottom:0;">
            <span style="display:flex; flex-direction:column;">
                <span>Layer Spheres</span>
                <span style="font-size:0.8rem; color:var(--text-muted);">(Triangular)</span>
            </span>
            <span class="val" id="val-trin">0</span>
        </div>

        <div class="slider-wrap">
            <label for="slider-k" style="font-size: 0.9em; color:var(--text-muted);">Layer Highlight (k)</label>
            <input type="range" id="slider-k" min="0" max="1" value="0" step="1">
            <div class="labels">
                <span>0 (None)</span>
                <span id="label-k-max">1</span>
            </div>
        </div>
        
        <div style="margin-top: 30px; display: flex; gap: 8px; justify-content: center;">
            <button class="btn" id="btn-screenshot">📷 Screenshot</button>
            <button class="btn" id="btn-record">🎥 Record 360°</button>
        </div>
    </div>

    <div class="panel" id="ui-right">
        <h2>2D Layer View</h2>
        <span style="font-size:0.9rem; color:var(--text-muted); margin-bottom: 10px;">Triangular Number: <span id="val-trin-right" style="color:var(--accent); font-weight:bold;">0</span></span>
        <div id="svg-container"></div>
    </div>

    <div class="panel" id="ui-bottom">
        <span style="font-size: 0.9rem; margin-right: 8px; align-self: center; color:var(--text-muted);">Camera:</span>
        <button class="btn" onclick="setCamera('iso')">ISO</button>
        <button class="btn" onclick="setCamera('top')">Top</button>
        <button class="btn" onclick="setCamera('front')">Front Face</button>
        <button class="btn" onclick="setCamera('left')">Left Face</button>
        <button class="btn" onclick="setCamera('right')">Right Face</button>
        <button class="btn" onclick="setCamera('bottom')">Bottom Base</button>
    </div>

    <!-- Three.js + OrbitControls + GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        let isLightMode = false;
        
        function updateSceneBackground() {
            scene.background = new THREE.Color(isLightMode ? '#f0f2f5' : '#141418');
            scene.fog = new THREE.FogExp2(isLightMode ? '#f0f2f5' : '#141418', 0.015);
        }
        updateSceneBackground();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        // Default to ISO roughly (1,1,1)*18 length, matching the preset
        camera.position.set(10.4, 10.4, 10.4);

        // Required preserveDrawingBuffer for screenshot export
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 60;
        controls.target.set(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight1.position.set(10, 20, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xaabbff, 0.4);
        dirLight2.position.set(-10, 5, -10);
        scene.add(dirLight2);

        // 2. Tetrahedral Logic
        const maxN = 10;
        const sphereRadius = 0.5;
        const distance = 1.0;
        
        const group3D = new THREE.Group();
        scene.add(group3D);
        const spheres3D = [];
        const geometry = new THREE.SphereGeometry(sphereRadius, 32, 32);

        // Pre-generate all spheres for max n = 10
        for (let l = 0; l < maxN; l++) {
            const hue = (l / (maxN - 1)) * 270;
            const color = new THREE.Color(`hsl(${hue}, 100%, 50%)`);
            
            const material = new THREE.MeshPhongMaterial({
                color: color,
                transparent: true,
                opacity: 0.75,
                shininess: 90,
                specular: 0x444444
            });

            for (let r = 0; r <= l; r++) {
                for (let c = 0; c <= r; c++) {
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    const x = (c - r / 2) * distance;
                    const z = (r * Math.sqrt(3)/2 - l * Math.sqrt(3)/3) * distance;
                    const y = -l * Math.sqrt(2/3) * distance;

                    mesh.position.set(x, y, z);
                    mesh.scale.set(0, 0, 0); 
                    mesh.userData = { layer: l, active: false, baseColor: color };
                    
                    group3D.add(mesh);
                    spheres3D.push(mesh);
                }
            }
        }

        // 3. UI and State Updates
        const sliderN = document.getElementById('slider-n');
        const sliderK = document.getElementById('slider-k');
        
        const valN = document.getElementById('val-n');
        const valTn = document.getElementById('val-tn');
        const valK = document.getElementById('val-k');
        const valTriN = document.getElementById('val-trin');
        const valTriNRight = document.getElementById('val-trin-right');
        const labelKMax = document.getElementById('label-k-max');
        const svgContainer = document.getElementById('svg-container');

        let currentN = 8;
        let currentK = 0;

        function render2DSVG() {
            if (currentK === 0) {
                svgContainer.innerHTML = '<span style="color:var(--text-muted);font-style:italic;">No Layer Selected</span>';
                return;
            }

            const targetHue = ((currentK - 1) / (maxN - 1)) * 270;
            const targetColor = `hsl(${targetHue}, 100%, 50%)`;
            
            // Generate SVG content dynamically based on currentK
            // Reduce radius and spacing to fit max n=10 in a 250x250 container
            const R = 8; // circle radius
            const spacing = 22; // distance between centers
            
            // Calculate bounding box centered in svg
            const width = 250;
            const height = 250;
            
            let svgStr = `<svg width="100%" height="100%" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
            
            // Triangle height and offset
            const triHeight = (currentK - 1) * spacing * Math.sqrt(3)/2;
            const startY = (height - triHeight) / 2;
            const startX = width / 2;

            for (let r = 0; r < currentK; r++) {
                const y = startY + r * spacing * Math.sqrt(3)/2;
                for (let c = 0; c <= r; c++) {
                    const x = startX + (c - r / 2) * spacing;
                    // Provide a static r fallback and use a simpler animation that works universally.
                    svgStr += `<circle cx="${x}" cy="${y}" r="${R}" fill="${targetColor}" opacity="0.9">
                                 <animate attributeName="r" values="0;${R}" dur="0.4s" begin="0s" fill="freeze" />
                               </circle>`;
                }
            }
            svgStr += `</svg>`;
            svgContainer.innerHTML = svgStr;
        }

        function updateState() {
            const maxKForN = currentN;
            sliderK.max = maxKForN;
            labelKMax.innerText = maxKForN;

            if (currentK > maxKForN) {
                currentK = maxKForN;
                sliderK.value = maxKForN;
            }

            valN.innerText = currentN;
            valK.innerText = currentK;

            const tn = (currentN * (currentN + 1) * (currentN + 2)) / 6;
            let trin = currentK > 0 ? (currentK * (currentK + 1)) / 2 : 0;

            gsap.to(valTn, { innerHTML: tn, duration: 0.4, snap: { innerHTML: 1 }, onUpdate: function() { valTn.innerText = Math.round(this.targets()[0].innerHTML); } });
            gsap.to([valTriN, valTriNRight], { 
                innerHTML: trin, 
                duration: 0.4, 
                snap: { innerHTML: 1 }, 
                onUpdate: function() { 
                    const val = Math.round(this.targets()[0].innerHTML);
                    valTriN.innerText = val;
                    valTriNRight.innerText = val;
                } 
            });

            // Visual Updates - 3D Tetrahedral
            spheres3D.forEach(mesh => {
                const layerIndex = mesh.userData.layer;
                const shouldBeActive = layerIndex < currentN;
                const isTargetLayer = (currentK > 0) && (layerIndex === currentK - 1);
                
                let targetOpacity = 0.75;
                if (currentK > 0) {
                    targetOpacity = isTargetLayer ? 1.0 : 0.35;
                }

                if (shouldBeActive && Math.abs(mesh.material.opacity - targetOpacity) > 0.05) {
                    gsap.to(mesh.material, { opacity: targetOpacity, duration: 0.4 });
                }

                if (shouldBeActive && !mesh.userData.active) {
                    mesh.userData.active = true;
                    gsap.killTweensOf(mesh.scale);
                    gsap.to(mesh.scale, {
                        x: 1, y: 1, z: 1, duration: 0.6, ease: "back.out(1.5)", delay: layerIndex * 0.05
                    });
                } else if (!shouldBeActive && mesh.userData.active) {
                    mesh.userData.active = false;
                    gsap.killTweensOf(mesh.scale);
                    gsap.to(mesh.scale, {
                        x: 0, y: 0, z: 0, duration: 0.4, ease: "power2.in", delay: Math.max(0, (layerIndex - currentN)) * 0.02
                    });
                }
            });

            const currentTotalHeight3D = (currentN - 1) * Math.sqrt(2/3) * distance;
            gsap.to(group3D.position, { y: currentTotalHeight3D / 2, duration: 0.6, ease: "power2.out" });

            render2DSVG();
        }

        sliderN.addEventListener('input', (e) => { currentN = parseInt(e.target.value); updateState(); });
        sliderK.addEventListener('input', (e) => { currentK = parseInt(e.target.value); updateState(); });

        currentN = parseInt(sliderN.value);
        currentK = parseInt(sliderK.value);
        updateState();

        // 4. Camera Presets (Using geometric face normals for perfect symmetry)
        // A regular tetrahedron mathematically bounded faces have specific normals.
        // Viewing squarely along these normals mitigates perspective skew that makes edges "appear unequal"
        function setCamera(view) {
            const radius = 18;
            let targetPos = new THREE.Vector3();
            
            // These normals are exact mathematical outward normals for the faces
            switch(view) {
                case 'iso': targetPos.set(1, 1, 1).normalize().multiplyScalar(radius); break;
                case 'top': targetPos.set(0, 1, 0).multiplyScalar(radius); break;
                case 'bottom': targetPos.set(0, -1, 0).multiplyScalar(radius); break;
                // Front Face Normal: Vector3(0, 1/3, 2*sqrt(2)/3)
                case 'front': targetPos.set(0, 0.3333, 0.9428).normalize().multiplyScalar(radius); break;
                // Left Face Normal: Vector3(-sqrt(2/3), 1/3, -sqrt(2)/3)
                case 'left': targetPos.set(-0.8164, 0.3333, -0.4714).normalize().multiplyScalar(radius); break;
                // Right Face Normal: Vector3(sqrt(2/3), 1/3, -sqrt(2)/3)
                case 'right': targetPos.set(0.8164, 0.3333, -0.4714).normalize().multiplyScalar(radius); break;
            }
            
            gsap.to(camera.position, {
                x: targetPos.x, y: targetPos.y, z: targetPos.z,
                duration: 1.2,
                ease: "power3.inOut"
            });
            gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.2 });
        }

        // 5. Theme Toggle
        const btnTheme = document.getElementById('btn-theme');
        btnTheme.addEventListener('click', () => {
            isLightMode = !isLightMode;
            document.documentElement.setAttribute('data-theme', isLightMode ? 'light' : 'dark');
            btnTheme.innerText = isLightMode ? 'To Dark' : 'To Light';
            updateSceneBackground();
        });

        // 6. Exports
        document.getElementById('btn-screenshot').addEventListener('click', () => {
            renderer.render(scene, camera);
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = `tetrahedral-n${currentN}-k${currentK}.png`;
            link.click();
        });

        document.getElementById('btn-record').addEventListener('click', async () => {
            const overlay = document.getElementById('export-overlay');
            overlay.style.display = 'flex';
            
            // Rotate 360 degrees smoothly
            const duration = 4.0; 
            const fps = 30;
            const originalAzimuth = controls.getAzimuthalAngle();
            
            const stream = renderer.domElement.captureStream(fps);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];
            
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tetrahedral-rotation.webm`;
                a.click();
                overlay.style.display = 'none';
            };
            
            recorder.start();

            // Animate angle manually
            gsap.to({ val: originalAzimuth }, {
                val: originalAzimuth + Math.PI * 2,
                duration: duration,
                ease: "none",
                onUpdate: function() {
                    const radius = camera.position.distanceTo(controls.target);
                    const polar = controls.getPolarAngle();
                    const azim = this.targets()[0].val;
                    camera.position.x = controls.target.x + radius * Math.sin(polar) * Math.sin(azim);
                    camera.position.z = controls.target.z + radius * Math.sin(polar) * Math.cos(azim);
                    camera.position.y = controls.target.y + radius * Math.cos(polar);
                    camera.lookAt(controls.target);
                },
                onComplete: () => {
                    recorder.stop();
                }
            });
        });

        // 7. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
